plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id + '-addon'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    main.resources.srcDir 'src/main/templates'
}

def mixinModuleDir = layout.buildDirectory.dir('mixinmodule')

def refmapDir = layout.buildDirectory.dir('generated/refmap')

tasks.register('assembleRefmap', Copy) {
    dependsOn 'compileJava'
    from(file("$buildDir/tmp/compileJava/compileJava-refmap.json"))
    rename { "${mod_id}.refmap.json" }
    into refmapDir
}

tasks.register('prepareMixinModule', Copy) {
    dependsOn 'processResources', 'assembleRefmap'
    from(sourceSets.main.output.resourcesDir) {
        include "${mod_id}.mixins.json"
    }
    from(refmapDir) {
        include "${mod_id}.refmap.json"
    }
    into mixinModuleDir
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Automatically apply mixin config in the development environment
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            lazyToken 'minecraft_classpath', {
                mixinModuleDir.get().asFile.absolutePath
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        name = "wd Maven"
        url = "https://wdiscute.github.io"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://girafi.dk/maven/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:starcatcher-1357603:9204510")
    runtimeOnly fg.deobf("maven.modrinth:wds-selling-bin:1.4.3-FORGE-1.20.1")
    runtimeOnly fg.deobf("maven.modrinth:libtooltips:2.3.2-FORGE-1.20.1")
    runtimeOnly fg.deobf("maven.modrinth:fancytabsections:6.2.3-FORGE-1.20.1")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("com.wdiscute:wdUtils:1.9.3-FORGE-1.20.1")
}

tasks.configureEach { task ->
    if (task.name == 'runClient') {
        task.dependsOn 'prepareMixinModule'
    }
}
tasks.named('jar') {
    dependsOn 'assembleRefmap'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    jar {
        from(refmapDir) {
            include "scauto_x.refmap.json"
        }
        manifest {
            attributes([
                    "Specification-Title": mod_id,
                    "Specification-Vendor": mod_authors,
                    "Specification-Version": "1",
                    "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion,
                    "Implementation-Vendor" : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}